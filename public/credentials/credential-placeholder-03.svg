<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Certificate placeholder artwork</title>
  <desc id="desc">An abstract ivory credential sheet on a deep botanical background, marked as a placeholder.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10251c"/>
      <stop offset=".55" stop-color="#203a2b"/>
      <stop offset="1" stop-color="#0a1310"/>
    </linearGradient>
    <radialGradient id="glow" cx=".86" cy=".12" r=".75">
      <stop offset="0" stop-color="#b7e36b" stop-opacity=".36"/>
      <stop offset="1" stop-color="#b7e36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0e5"/>
      <stop offset="1" stop-color="#d5d8c6"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#ground)"/>
  <rect width="1200" height="760" fill="url(#glow)"/>
  <g fill="none" stroke="#b7e36b" stroke-opacity=".2">
    <circle cx="1000" cy="150" r="245"/>
    <circle cx="1000" cy="150" r="202"/>
    <circle cx="1000" cy="150" r="158"/>
    <path d="M-40 590 C190 410 326 720 544 544 S906 365 1240 530" stroke-width="2"/>
    <path d="M-40 626 C190 446 326 756 544 580 S906 401 1240 566"/>
  </g>
  <g transform="translate(355 78) rotate(-3 245 290)" filter="url(#shadow)">
    <rect width="490" height="580" rx="4" fill="url(#paper)"/>
    <rect x="16" y="16" width="458" height="548" fill="none" stroke="#71844a" stroke-width="2"/>
    <rect x="28" y="28" width="434" height="524" fill="none" stroke="#8a9279" stroke-opacity=".55"/>
    <circle cx="245" cy="150" r="60" fill="none" stroke="#71844a" stroke-width="2.5"/>
    <circle cx="245" cy="150" r="43" fill="none" stroke="#71844a" stroke-opacity=".65"/>
    <path d="M245 112 257 139 286 143 264 163 270 191 245 177 220 191 226 163 204 143 233 139Z" fill="#71844a" fill-opacity=".7"/>
    <path d="M96 253H394 M121 281H369 M155 309H335" stroke="#7b8072" stroke-width="5" stroke-linecap="round" opacity=".5"/>
    <path d="M153 369H337" stroke="#71844a" stroke-width="2"/>
    <path d="M125 409H213 M277 409H365" stroke="#7b8072" stroke-width="2" stroke-linecap="round" opacity=".5"/>
    <text x="245" y="455" text-anchor="middle" fill="#526345" font-family="monospace" font-size="15" letter-spacing="3">PLACEHOLDER</text>
    <text x="245" y="482" text-anchor="middle" fill="#7b8072" font-family="monospace" font-size="10" letter-spacing="2">CREDENTIAL ARTWORK</text>
  </g>
  <path d="M64 70H170 M64 70V146 M1136 690H1030 M1136 690V614" stroke="#b7e36b" stroke-width="2" stroke-opacity=".65" fill="none"/>
  <text x="64" y="206" font-family="monospace" font-size="18" letter-spacing="5" fill="#e7efdc" fill-opacity=".65">LEARNING RECORD</text>
